name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 22
          package-manager: pnpm@latest
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_COMPANY_DATASOURCE: ${{ secrets.NOTION_COMPANY_DATASOURCE }}
          NOTION_TECH_STACK_DATASOURCE: ${{ secrets.NOTION_TECH_STACK_DATASOURCE }}
          NOTION_PROJECTS_DATASOURCE: ${{ secrets.NOTION_PROJECTS_DATASOURCE }}
          NOTION_EDUCATIONS_DATASOURCE: ${{ secrets.NOTION_EDUCATIONS_DATASOURCE }}
          NOTION_TECHNICAL_DECISIONS_DATASOURCE: ${{ secrets.NOTION_TECHNICAL_DECISIONS_DATASOURCE }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
